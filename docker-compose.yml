services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: brandguard
      MYSQL_USER: brandguard
      MYSQL_PASSWORD: brandguard
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - brandguard-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=localhost --user=root --password=$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  brandguard-mysql:
